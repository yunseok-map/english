name: iOS IPA 빌드

# 맥 없이 아이폰 설치용 IPA를 만든다.
# GitHub의 무료 macOS 러너에서 빌드하고, 결과물(IPA)을 Artifacts 로 내려받는다.
# 서명은 하지 않는다 — 윈도우의 Sideloadly/AltStore 가 본인 Apple ID로 서명해서 설치한다.

on:
  workflow_dispatch: # Actions 탭에서 직접 실행
  push:
    tags:
      - "v*" # v1.0.0 같은 태그를 푸시하면 릴리스까지 자동으로 만든다

# 릴리스 생성과 source/apps.json 되돌려 쓰기에 필요하다.
permissions:
  contents: write

# 두 빌드가 겹치면 마지막에 main 으로 apps.json 을 되돌려 쓰는 단계가 경합한다.
# 실제로 v1.0.14 때 같은 제목의 커밋이 두 개 남았다. 한 번에 하나만 돌린다.
concurrency:
  group: ipa-release
  cancel-in-progress: false

jobs:
  build:
    # Capacitor 8 의 Swift 모듈은 Xcode 16 이상에서만 읽힌다.
    # macos-14(Xcode 15.4)에서는 플러그인 API가 통째로 안 보여 빌드가 깨진다.
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 태그 빌드에서도 main 으로 되돌아가 커밋할 수 있어야 한다

      # SideStore 는 설치된 앱 버전과 소스의 버전을 비교해 업데이트를 띄운다.
      # 태그 이름을 그대로 앱 버전으로 박아야 "업데이트 있음" 이 계속 뜨지 않는다.
      - name: 버전 결정
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="0.0.$GITHUB_RUN_NUMBER"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "앱 버전: $V"

      # 버전은 package.json 의 packageManager 필드에서 읽는다.
      # 여기에 version 을 또 적으면 "Multiple versions of pnpm specified" 로 실패한다.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      # 타입 오류는 vite build 를 통과한다(트랜스파일만 하므로).
      # 여기서 막지 않으면 깨진 코드가 그대로 IPA 로 나간다.
      - name: 타입 검사
        run: pnpm check

      # 정답 인덱스가 범위를 벗어나거나 레벨 테스트 한 칸의 문항 수가 어긋나는
      # 것은 타입으로는 안 잡힌다. 손으로 쓴 콘텐츠라 여기서 한 번 더 본다.
      - name: 콘텐츠 검사
        run: pnpm validate

      - name: 웹 앱 빌드
        run: pnpm exec vite build
        env:
          APP_VERSION: ${{ steps.ver.outputs.version }}

      # 청크 간 순환 import 는 크롬에서 통과하고 iOS WKWebView 에서만
      # 흰 화면으로 죽는다. 기기에 올라가기 전에 여기서 막는다.
      - name: 번들 검사 (순환 import·참조 누락)
        run: node scripts/check-chunks.mjs dist/public

      - name: iOS 프로젝트에 동기화
        run: pnpm exec cap sync ios

      # Windows 에서 cap sync 를 돌리면 Package.swift 에 역슬래시 경로가 들어간다.
      # macOS 에서 재생성되지만, 혹시 남아 있으면 여기서 정규화한다.
      - name: SPM 경로 정규화
        run: |
          PKG="ios/App/CapApp-SPM/Package.swift"
          # \x5c 는 역슬래시. 이스케이프 지옥을 피하려고 코드포인트로 적었다.
          # 역슬래시가 없으면 아무 일도 일어나지 않으므로 조건 없이 실행한다.
          perl -i -pe 's{\x5c}{/}g' "$PKG"
          cat "$PKG"

      # 러너 이미지에 여러 Xcode 가 깔려 있고 기본값이 최신이 아닐 수 있다.
      # 설치된 것 중 가장 높은 버전을 명시적으로 고른다.
      - name: Xcode 최신 버전 선택
        run: |
          ls -d /Applications/Xcode*.app
          LATEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "선택한 Xcode: $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version
          swift --version

      - name: 서명 없이 앱 빌드
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -destination 'generic/platform=iOS' \
            MARKETING_VERSION="${{ steps.ver.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            build

      - name: IPA 로 포장
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/App.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "빌드 결과물을 찾지 못했습니다: $APP_PATH"
            find build -name "*.app" -maxdepth 6 || true
            exit 1
          fi
          mkdir -p output/Payload
          cp -R "$APP_PATH" output/Payload/
          cd output
          # 파일명은 ASCII 로 둔다. 한글 파일명은 윈도우에서 압축을 풀 때 깨질 수 있다.
          zip -qry "WoholEnglish.ipa" Payload
          rm -rf Payload
          ls -lh

      - name: IPA 업로드
        uses: actions/upload-artifact@v4
        with:
          name: wohol-english-ipa
          path: output/*.ipa
          retention-days: 30
          if-no-files-found: error

      # 여기서부터는 태그 빌드에서만 돈다.
      # 릴리스에 IPA 를 붙이면 SideStore 가 그 주소에서 바로 받아 설치할 수 있다.
      - name: 릴리스 생성 + IPA 첨부
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: output/WoholEnglish.ipa
          tag_name: ${{ github.ref_name }}
          name: 워홀 영어 훈련 ${{ github.ref_name }}
          body: |
            SideStore 에 아래 소스를 등록해 두면 케이블 없이 바로 설치·업데이트할 수 있습니다.

            ```
            https://raw.githubusercontent.com/${{ github.repository }}/main/source/apps.json
            ```

            설치 방법은 `docs/SideStore-설치가이드.md` 를 보세요.

      # SideStore 소스가 새 버전을 가리키도록 main 에 되돌려 커밋한다.
      - name: 소스(apps.json) 갱신
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # cap sync 가 Package.swift(추적 파일)를 다시 써서 워킹트리가 더럽다.
          # 빌드 부산물이므로 -f 로 버리고 main 으로 옮긴다. output/ 은 untracked 라 살아남는다.
          # 태그 메시지를 SideStore 의 버전 설명으로 쓴다. 안 넘기면 모든 버전이
          # 같은 소개문으로 채워져서 앱 안에서 무엇이 바뀌었는지 알 수 없다.
          NOTES=$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")
          git fetch origin main
          git checkout -f -B main origin/main
          RELEASE_NOTES="$NOTES" node scripts/update-source.mjs "${GITHUB_REF_NAME#v}" output/WoholEnglish.ipa
          git add source/apps.json
          if git diff --cached --quiet; then
            echo "소스에 바뀐 내용이 없습니다."
          else
            git commit -m "chore: SideStore 소스 ${GITHUB_REF_NAME} 로 갱신"
            git push origin main
          fi
